<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar de Password · NutriZoo LT</title>
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body data-pantalla="cambiar-password" data-requiere-sesion>
<div class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Menú lateral"></aside>
  <div class="velo" aria-hidden="true"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-izq">
        <button type="button" class="hamburguesa" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <div class="tit">
          <h1>Cambiar de Password</h1>
          <p>Actualización del PassWord de la cuenta en sesión</p>
        </div>
      </div>
      <div class="usuario">
        <div class="avatar" id="usuario-iniciales">—</div>
        <div class="datos">
          <strong id="usuario-nombre">—</strong>
          <span id="usuario-rol">—</span>
        </div>
        <a href="#" class="salir" id="cerrar-sesion">Cerrar sesión</a>
      </div>
    </header>

    <main class="contenido">

      <div class="card">
        <div class="cambio-cabecera">
          <div class="sello sello-peq" aria-hidden="true">Z</div>
          <div>
            <h3>Cambiar PassWord</h3>
          </div>
        </div>

        <form id="form-cambiar-clave" novalidate>
          <div class="dos">
            <div class="campo">
              <label for="clave-actual">PassWord Anterior <span class="req">*</span></label>
              <div class="campo-clave">
                <input id="clave-actual" type="password"
                       autocomplete="current-password">
                <button type="button" class="ver-clave" data-campo="clave-actual"
                        aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
              </div>
              <p class="campo-error" id="err-clave-actual" role="alert" hidden></p>
            </div>

            <div class="campo">
              <label for="clave-nueva">PassWord Nuevo <span class="req">*</span></label>
              <div class="campo-clave">
                <input id="clave-nueva" type="password"
                       autocomplete="new-password">
                <button type="button" class="ver-clave" data-campo="clave-nueva"
                        aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
              </div>
              <p class="campo-error" id="err-clave-nueva" role="alert" hidden></p>
            </div>

            <div class="campo">
              <label for="clave-repetir">Repetir PassWord Nuevo <span class="req">*</span></label>
              <div class="campo-clave">
                <input id="clave-repetir" type="password"
                       autocomplete="new-password">
                <button type="button" class="ver-clave" data-campo="clave-repetir"
                        aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
              </div>
              <p class="campo-error" id="err-clave-repetir" role="alert" hidden></p>
            </div>
          </div>

          <div class="msj" id="cambio-msg" role="alert" hidden></div>

          <div class="acciones">
            <button type="submit" class="btn2" id="btn-aceptar-clave" data-real disabled>Aceptar</button>
            <button type="button" class="btn-gris" id="btn-cancelar-clave" data-real>Cancelar</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
