<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>1.2 Asignación de roles a usuarios · NutriZoo LT</title>
<link href="assets/css/estilos.css" rel="stylesheet"/>
</head>
<body data-modulo="1" data-pantalla="seguridad-roles" data-requiere-sesion="">
<div class="app-layout">
<aside aria-label="Menú lateral" class="sidebar" id="sidebar"></aside>
<div aria-hidden="true" class="velo"></div>
<div class="main">
<header class="topbar">
<div class="topbar-izq">
<button aria-expanded="false" aria-label="Abrir menú" class="hamburguesa" type="button">☰</button>
<div class="tit">
<h1>1.2 Asignación de roles a usuarios</h1>
<p>Rol de cada cuenta y permisos heredados del rol</p>
</div>
</div>
<div class="usuario">
<div class="avatar" id="usuario-iniciales">—</div>
<div class="datos">
<strong id="usuario-nombre">—</strong>
<span id="usuario-rol">—</span>
</div>
<a class="salir" href="#" id="cerrar-sesion">Cerrar sesión</a>
</div>
</header>
<main class="contenido">

<div class="kpis" id="roles-kpis"></div>

<div class="cuenta-grid">
<section class="card panel-cuenta">
<h3>Asignación de rol al usuario</h3>
<div class="dos">
<div class="campo"><label for="asig-usuario">NAME USER <span class="req">*</span></label>
<select id="asig-usuario"><option value="">Seleccione el nombre de la persona</option></select>
</div>
<div class="campo"><label for="asig-login">LOGIN</label><input autocomplete="off" id="asig-login" readonly spellcheck="false" type="text" value="—"/></div>
<div class="campo"><label for="asig-rol-actual">ROL ACTUAL</label><input id="asig-rol-actual" readonly type="text" value="—"/></div>
<div class="campo"><label for="asig-rol">ROL A ASIGNAR <span class="req">*</span></label>
<select id="asig-rol"><option value="">Seleccione un rol</option></select>
</div>
<div class="campo"><label for="asig-vigencia">VIGENCIA DE LA CUENTA</label><input id="asig-vigencia" readonly type="text" value="—"/></div>
<div class="campo"><label for="asig-estado">EDO. DE LA CUENTA</label><input id="asig-estado" readonly type="text" value="—"/></div>
</div>

<p class="campo-error" id="asig-error" role="alert" hidden></p>
</section>

<aside class="card panel-opciones">
<h3>OPCIONES</h3>
<button class="btn-opcion" data-real id="asig-guardar" type="button">ASIGNAR / GUARDAR</button>
<button class="btn-opcion" data-real id="asig-quitar" type="button">QUITAR ROL</button>
<button class="btn-opcion" data-real id="asig-cancelar" type="button">CANCEL</button>
<button class="btn-opcion" data-real id="asig-salir" type="button">SALIR</button>
</aside>
</div>

<div class="card">
<h3>Usuarios y roles asignados</h3>
<div class="filtros">
<div class="campo"><label for="asig-buscar">Buscar usuario</label><input autocomplete="off" id="asig-buscar" placeholder="Nombre o login" type="search"/></div>
<div class="campo"><label for="asig-filtro-rol">Filtrar por rol</label><select id="asig-filtro-rol"><option value="">Todos los roles</option></select></div>
<div class="campo"><label for="asig-filtro-estado">Edo. de la cuenta</label>
<select id="asig-filtro-estado">
<option value="">Todas</option>
<option value="activo">Activo</option>
<option value="inactivo">Inactivo</option>
</select>
</div>
</div>

<div class="tabla-scroll"><table class="tabla">
<tr><th>Nombre del usuario(s)</th><th>Login</th><th>Rol asignado</th><th>Fec.Inic</th><th>Fec.Venc</th><th>Edo. Cta.</th><th>ASIGNAR</th></tr>
<tbody id="cuerpo-asignacion"></tbody>
</table></div>

<div class="tabla-pie" id="asig-pie" hidden></div>
</div>

<div class="msj" id="asig-msg" role="alert" hidden></div>

</main>
</div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
