<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Mantenimiento de catálogos · NutriZoo LT</title>
<link href="assets/css/estilos.css" rel="stylesheet"/>
</head>
<body data-modulo="2" data-pantalla="catalogo-mantenimiento" data-requiere-sesion="">
<div class="app-layout">
<aside aria-label="Menú lateral" class="sidebar" id="sidebar"></aside>
<div aria-hidden="true" class="velo"></div>
<div class="main">
<header class="topbar">
<div class="topbar-izq">
<button aria-expanded="false" aria-label="Abrir menú" class="hamburguesa" type="button">☰</button>
<div class="tit">
<h1>Mantenimiento de catálogos</h1>
<p>Altas, bajas, modificaciones y consultas de catálogos</p>
</div>
</div>
<div class="usuario">
<div class="avatar" id="usuario-iniciales">—</div>
<div class="datos">
<strong id="usuario-nombre">—</strong>
<span id="usuario-rol">—</span>
</div>
<a class="salir" href="#" id="cerrar-sesion">Cerrar sesión</a>
</div>
</header>
<main class="contenido">

<div class="card">
<h3>Mantenimiento de Catálogo</h3>

<div class="cat-cabecera">
<div class="campo">
<label for="cat-nombre">Nombre de Catálogo:</label>
<select id="cat-nombre"><option value="">Seleccione un catálogo</option></select>
</div>
</div>

<div class="roles-cuerpo">
<div>
<div class="campo">
<label for="cat-descripcion">Descripción:</label>
<input autocomplete="off" id="cat-descripcion" maxlength="80" spellcheck="false" type="text"/>
</div>

<div class="tabla-scroll">
<table class="tabla">
<thead>
<tr><th style="width:170px">Clave</th><th>Descripción</th></tr>
</thead>
<tbody id="cat-cuerpo"></tbody>
</table>
</div>

<div class="tabla-pie" id="cat-pie" hidden></div>
<div class="msj" id="cat-msg" role="alert" hidden></div>
</div>

<aside class="tareas" aria-label="Tareas">
<h4>Tareas</h4>
<button class="btn2 btn-tarea" data-real id="cat-nuevo" type="button">Nuevo / Grabar</button>
<button class="btn2 btn-tarea" data-real id="cat-consultar" type="button">Consultar</button>
<button class="btn-rojo btn-tarea" data-real id="cat-eliminar" type="button">Eliminar</button>
<button class="btn2 btn-tarea" data-real id="cat-modificar" type="button">Modificar</button>
<button class="btn-gris btn-tarea" data-real id="cat-cancelar" type="button">Cancelar</button>
<button class="btn-gris btn-tarea" data-real id="cat-salir" type="button">Salir / Regresar</button>
</aside>
</div>
</div>

</main>
</div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
