<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Aplicaciones del sistema · NutriZoo LT</title>
<link href="assets/css/estilos.css" rel="stylesheet"/>
</head>
<body data-modulo="1" data-pantalla="seguridad-aplicaciones" data-requiere-sesion="">
<div class="app-layout">
<aside aria-label="Menú lateral" class="sidebar" id="sidebar"></aside>
<div aria-hidden="true" class="velo"></div>
<div class="main">
<header class="topbar">
<div class="topbar-izq">
<button aria-expanded="false" aria-label="Abrir menú" class="hamburguesa" type="button">☰</button>
<div class="tit">
<h1>Aplicaciones del sistema</h1>
<p>Clave y descripción de cada aplicación</p>
</div>
</div>
<div class="usuario">
<div class="avatar" id="usuario-iniciales">—</div>
<div class="datos">
<strong id="usuario-nombre">—</strong>
<span id="usuario-rol">—</span>
</div>
<a class="salir" href="#" id="cerrar-sesion">Cerrar sesión</a>
</div>
</header>
<main class="contenido">

<div class="card">
<div class="panel-campo">
<div class="leyenda-panel">Ingresar</div>
<div class="dos">
<div class="campo">
<label for="app-clave">Clave de la aplicación:</label>
<input autocomplete="off" id="app-clave" maxlength="30" spellcheck="false" type="text"/>
</div>
<div class="campo">
<label for="app-descripcion">Descripción de la aplicación:</label>
<input autocomplete="off" id="app-descripcion" maxlength="80" spellcheck="false" type="text"/>
</div>
</div>
</div>

<div class="roles-cuerpo">
<div class="panel-campo">
<div class="leyenda-panel">Contenido</div>
<div class="tabla-scroll">
<table class="tabla">
<thead>
<tr><th style="width:170px">Clave</th><th>Descripción</th></tr>
</thead>
<tbody id="app-cuerpo"></tbody>
</table>
</div>
<div class="tabla-pie" id="app-pie" hidden></div>
</div>

<aside class="tareas" aria-label="Tareas">
<h4>Tareas</h4>
<button class="btn2 btn-tarea" data-real id="app-nuevo" type="button">Nuevo</button>
<button class="btn-rojo btn-tarea" data-real id="app-borrar" type="button">Borrar</button>
<button class="btn2 btn-tarea" data-real id="app-modif" type="button">Modif</button>
<button class="btn2 btn-tarea" data-real id="app-consul" type="button">Consul</button>
<button class="btn-gris btn-tarea" data-real id="app-cancel" type="button">Cancel</button>
<button class="btn-gris btn-tarea" data-real id="app-salir" type="button">Salir</button>
</aside>
</div>

<div class="msj" id="app-msg" role="alert" hidden></div>
</div>

</main>
</div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
